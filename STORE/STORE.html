<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تطبيقات AMINE MK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff3d00;
            --primary-hover: #ff5722;
            --bg-dark: #0a0a0a;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #aaa;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a1a 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: var(--primary-color);
            font-size: 36px;
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.3);
        }

        .logo p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 5px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-icon {
            width: 55px;
            height: 55px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #333;
            transition: var(--transition);
        }

        .search-icon:hover {
            background: var(--primary-color);
            transform: scale(1.1);
        }

        .search-box {
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: var(--transition);
        }

        .search-box.active {
            width: 300px;
            opacity: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px 25px;
            background: #222;
            border: 2px solid #444;
            border-radius: 30px;
            color: white;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        /* Status Bar */
        .status-bar {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
        }

        .back-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            cursor: pointer;
            margin: 15px auto;
            display: none;
            font-weight: bold;
            transition: var(--transition);
        }

        /* Apps Grid */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            color: white;
            border: 2px solid transparent;
            transition: var(--transition);
            position: relative;
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(255, 61, 0, 0.2);
        }

        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            background: #333;
            margin-left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-info {
            flex: 1;
            text-align: right;
        }

        .app-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-tag {
            background: rgba(255, 61, 0, 0.15);
            color: var(--primary-color);
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .app-info p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .app-meta {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: #777;
        }

        .download-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: var(--transition);
            min-width: 120px;
            position: relative;
        }

        .download-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .download-btn.downloading {
            background: #4CAF50;
        }

        .download-btn.completed {
            background: #2196F3;
        }

        /* Progress indicator */
        .download-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }

        /* Developer Section */
        .developer-profile {
            background: rgba(255, 61, 0, 0.05);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            margin-top: 80px;
            border: 1px solid rgba(255, 61, 0, 0.1);
        }

        .developer-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid var(--primary-color);
            margin: -100px auto 20px;
            background: #222;
            padding: 5px;
        }

        .developer-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: var(--transition);
            border: 1px solid #333;
        }

        .social-link:hover {
            background: var(--primary-color);
            transform: translateY(-5px);
        }

        /* Footer */
        .footer {
            padding: 40px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            
            .apps-grid {
                grid-template-columns: 1fr;
            }
            
            .search-box.active {
                width: 80vw;
            }
            
            .app-card {
                flex-direction: column;
                text-align: center;
            }
            
            .app-icon {
                margin: 0 0 15px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>AMINE MK STORE</h1>
                <p><i class="fas fa-tv"></i> التطبيقات الأفضل لجهازك الذكي</p>
            </div>
            
            <div class="search-container">
                <div class="search-box" id="searchBox">
                    <input type="text" id="searchInput" placeholder="ابحث عن تطبيق...">
                </div>
                <div class="search-icon" id="searchIcon" tabindex="0">
                    <i class="fas fa-search"></i>
                </div>
            </div>
        </header>

        <!-- Status -->
        <div class="status-bar">
            <span id="resultsCount">جاري تحميل التطبيقات...</span>
            <button class="back-btn" id="backBtn">العودة للرئيسية</button>
        </div>

        <!-- Apps -->
        <main class="apps-grid" id="appsList">
            <!-- Dynamic Content -->
        </main>

        <!-- Developer -->
        <section class="developer-profile">
            <div class="developer-avatar">
                <img src="https://ui-avatars.com/api/?name=AMINE+MK&background=ff3d00&color=fff&size=200" alt="AMINE MK">
            </div>
            <h2 style="font-size: 2rem; margin-bottom: 5px;">AHMED AMINE MK</h2>
            <p style="color: var(--primary-color); font-weight: bold; margin-bottom: 20px;">مطور تطبيقات Android TV</p>
            <p style="max-width: 600px; margin: 0 auto; color: var(--text-dim); line-height: 1.8;">
                نحن نهتم بتوفير أفضل التطبيقات المعدلة والأساسية لمستخدمي الشاشات الذكية في الوطن العربي.
            </p>
            
            <div class="social-links">
                <a href="#" class="social-link"><i class="fab fa-telegram-plane"></i></a>
                <a href="#" class="social-link"><i class="fab fa-youtube"></i></a>
                <a href="#" class="social-link"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
            </div>
        </section>

        <footer class="footer">
            جميع الحقوق محفوظة &copy; 2024 - AMINE MK
        </footer>
    </div>

    <script>
        // بيانات التطبيقات مع روابط مباشرة
        const apps = [
            {
                id: 1,
                name: "Yacine TV V3",
                desc: "البث المباشر للمباريات والقنوات العربية والعالمية بجودة مذهلة.",

                size: "12.4 MB",

                icon: "logo/yacine.webp",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "apk/YacineTV_V3.apk"
            },
			
			         {
                id: 2,
                name: "YTV Player Pro",
                desc: "المشغل الرسمي لتطبيق ياسين تيفي.",
                cat: "مشغل",
                size: "12.4 MB",
                rating: "4.9",
                icon: "logo/2.png",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "apk/YTVPlayer_12.0.apk"
            },
			            {
                id: 3,
                name: "Labil TV V1",
                desc: " للمباريات والقنوات العربية والعالمية بجودة مذهلة.",
                cat: "بث مباشر",
                size: "12.4 MB",
                rating: "4.9",
                icon: "logo/LabelTV.png",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "apk/LabelTV-V1.apk"
            },
			
			
            {
                id: 4,
                name: "SmartTube Next",
                desc: "يوتيوب مخصص للتلفاز بدون إعلانات مع دعم جودة 4K و HDR.",
                cat: "فيديو",
                size: "22.1 MB",
                rating: "5.0",
                icon: "https://via.placeholder.com/100/2196F3/ffffff?text=ST",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/smarttube.apk"
            },
            {
                id: 5,
                name: "IPTV Smarters",
                desc: "أفضل مشغل لروابط وقوائم IPTV مع واجهة سهلة للتحكم بالريموت.",
                cat: "مشغل",
                size: "28.5 MB",
                rating: "4.8",
                icon: "https://via.placeholder.com/100/4CAF50/ffffff?text=IPTV",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/iptvsmarters.apk"
            },
            {
                id: 6,
                name: "Nova TV",
                desc: "مكتبة ضخمة من الأفلام والمسلسلات مترجمة للعربية ومجانية تماماً.",
                cat: "سينما",
                size: "15.0 MB",
                rating: "4.7",
                icon: "https://via.placeholder.com/100/9C27B0/ffffff?text=NT",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/nova.apk"
            },
            {
                id: 7,
                name: "Downloader",
                desc: "الأداة الأساسية لتحميل التطبيقات من الروابط مباشرة على التلفاز.",
                cat: "أدوات",
                size: "4.2 MB",
                rating: "4.9",
                icon: "https://via.placeholder.com/100/FF9800/ffffff?text=DL",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/downloader.apk"
            },
            {
                id: 8,
                name: "TV Bro",
                desc: "متصفح ويب مخصص بالكامل للتصفح باستخدام ريموت التلفاز.",
                cat: "متصفح",
                size: "10.8 MB",
                rating: "4.6",
                icon: "https://via.placeholder.com/100/00BCD4/ffffff?text=TVB",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/tvbro.apk"
            },
            {
                id: 9,
                name: "Cinema HD",
                desc: "أفضل تطبيق لمشاهدة الأفلام والمسلسلات العربية والأجنبية.",
                cat: "سينما",
                size: "18.5 MB",
                rating: "4.7",
                icon: "https://via.placeholder.com/100/E91E63/ffffff?text=CHD",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/cinemahd.apk"
            },
            {
                id: 10,
                name: "ExpressVPN",
                desc: "أفضل VPN للشاشات الذكية مع سرعات عالية وأمان تام.",
                cat: "أدوات",
                size: "32.1 MB",
                rating: "4.8",
                icon: "https://via.placeholder.com/100/FF5722/ffffff?text=VPN",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "https://your-direct-link.com/expressvpn.apk"
            }
			,
            {
                id: 11,
                name: "القرآن لا اعلانات",
                desc: "أفضل  للشاشات الذكية مع سرعات عالية وأمان تام.",
                cat: "أدوات",
                size: "32.1 MB",
                rating: "4.8",
                icon: "logo/0.png",
                // ضع رابط التحميل المباشر هنا
                downloadUrl: "apk/Qran.apk"
            }
        ];

        const appsList = document.getElementById('appsList');
        const searchInput = document.getElementById('searchInput');
        const searchBox = document.getElementById('searchBox');
        const searchIcon = document.getElementById('searchIcon');
        const resultsCount = document.getElementById('resultsCount');
        const backBtn = document.getElementById('backBtn');

        // دالة لعرض التطبيقات
        function renderApps(data) {
            appsList.innerHTML = '';
            data.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                
                card.innerHTML = `
                    <div class="app-icon">
                        <img src="${app.icon}" alt="${app.name}" onerror="this.src='https://via.placeholder.com/100/333/fff?text=${app.name[0]}'">
                    </div>
                    <div class="app-info">
                        <h3>${app.name} <span class="app-tag">${app.cat}</span></h3>
                        <p>${app.desc}</p>
                        <div class="app-meta">
                            <span><i class="fas fa-hdd"></i> ${app.size}</span>
                            <span><i class="fas fa-star" style="color: #ffc107;"></i> ${app.rating}</span>
                        </div>
                    </div>
                    <button class="download-btn" data-app-id="${app.id}">تحميل الآن</button>
                `;

                appsList.appendChild(card);
            });
            resultsCount.innerText = `تم العثور على (${data.length}) تطبيق`;
        }

        // دالة لتحميل التطبيق مباشرة
        function downloadApp(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;
            
            // الحصول على زر التحميل
            const downloadBtn = document.querySelector(`button[data-app-id="${appId}"]`);
            const originalText = downloadBtn.innerHTML;
            
            // تغيير حالة الزر
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
            downloadBtn.classList.add('downloading');
            downloadBtn.disabled = true;
            
            // إنشاء رابط تحميل مخفي
            const link = document.createElement('a');
            link.href = app.downloadUrl;
            link.download = `${app.name.replace(/\s+/g, '_')}.apk`;
            link.target = '_blank';
            
            // إضافة الرابط للصفحة والنقر عليه
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // محاكاة تقدم التحميل
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 20;
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    
                    // بعد اكتمال التحميل
                    downloadBtn.innerHTML = '<i class="fas fa-check"></i> تم التحميل';
                    downloadBtn.classList.remove('downloading');
                    downloadBtn.classList.add('completed');
                    
                    // إعادة الزر لحالته الأصلية بعد 3 ثواني
                    setTimeout(() => {
                        downloadBtn.innerHTML = originalText;
                        downloadBtn.classList.remove('completed');
                        downloadBtn.disabled = false;
                    }, 3000);
                }
            }, 300);
        }

        // البحث
        searchIcon.onclick = () => {
            searchBox.classList.toggle('active');
            if(searchBox.classList.contains('active')) searchInput.focus();
        };

        // تصفية البحث
        searchInput.oninput = () => {
            const query = searchInput.value.toLowerCase();
            const filtered = apps.filter(a => 
                a.name.toLowerCase().includes(query) || 
                a.cat.toLowerCase().includes(query)
            );
            renderApps(filtered);
            backBtn.style.display = query ? 'block' : 'none';
        };

        backBtn.onclick = () => {
            searchInput.value = '';
            renderApps(apps);
            backBtn.style.display = 'none';
            searchBox.classList.remove('active');
        };

        // معالجة أحداث التحميل
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('download-btn')) {
                e.preventDefault();
                const appId = parseInt(e.target.getAttribute('data-app-id'));
                downloadApp(appId);
            }
        });

        // التحميل الأولي
        window.onload = () => {
            renderApps(apps);
        };

        // اختصار لوحة المفاتيح للبحث
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                searchBox.classList.add('active');
                searchInput.focus();
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
