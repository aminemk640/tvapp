        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* header premium */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;

            padding: 1.2rem 0 2rem;
            border-bottom: 1px solid rgba(255, 61, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ff5e3a, #ff2e00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 8px rgba(255, 46, 0, 0.3);
        }

        .logo p {
            color: #aaa;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-icon {
            width: 52px;
            height: 52px;
            background: #1e2a2f;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid #ff3d0022;
        }

        .search-icon:hover {
            background: #ff3d00;
            transform: scale(1.05);
            box-shadow: 0 0 12px #ff3d00;
        }

        .search-box {
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: width 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.25s;
        }

        .search-box.active {
            width: 280px;
            opacity: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px 22px;
            background: #12181c;
            border: 1.5px solid #2c3e3f;
            border-radius: 60px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #ff3d00;
            box-shadow: 0 0 6px #ff3d00aa;
        }

        /* status row */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            background: #ff3d00;
            border: none;
            padding: 8px 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: none;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: #ff6429;
            transform: translateX(-4px);
        }

        #resultsCount {
            font-size: 0.9rem;
            background: #111a1e;
            padding: 6px 18px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        /* apps grid - TV friendly */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.8rem;
            margin: 2rem 0 3rem;
        }

        .app-card {
            background: rgba(20, 28, 32, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 1.4rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(255, 80, 40, 0.2);
            transition: all 0.25s;
            cursor: default;
        }

        .app-card:hover {
            transform: translateY(-6px);
            border-color: #ff4d1e;
            background: #1f2c30;
            box-shadow: 0 18px 30px -12px rgba(0,0,0,0.6);
        }

        .app-icon {
            width: 85px;
            height: 85px;
            background: #2c2f36;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-info {
            flex: 1;
            text-align: right;
        }

        .app-info h3 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-tag {
            background: #ff3d0022;
            color: #ffa270;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: bold;
        }

        .app-info p {
            font-size: 0.75rem;
            color: #bcbcbc;
            margin: 6px 0;
            line-height: 1.4;
        }

        .app-meta {
            display: flex;
            gap: 18px;
            margin-top: 8px;
            font-size: 0.7rem;
            color: #9aa6af;
        }

        .download-btn {
            background: linear-gradient(95deg, #ff3d00, #ff6a2e);
            border: none;
            padding: 10px 22px;
            border-radius: 28px;
            font-weight: bold;
            font-size: 0.8rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            min-width: 110px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

            background: #ff5722;
            box-shadow: 0 6px 14px #ff3d0066;
        }

        .download-btn:active {
            transform: scale(0.97);
        }

            background: #2e7d64;

        }

            background: #1976d2;
        }

            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2.8rem 1.5rem 2.5rem;
            text-align: center;
            margin-top: 60px;
            border: 1px solid rgba(255, 70, 0, 0.3);

            height: 120px;
            margin: -80px auto 20px;
            border-radius: 50%;
            border: 4px solid #ff3d00;
            background: #111;
            padding: 4px;
        }

        .developer-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 28px 0 12px;

            height: 48px;

            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;

        }

            background: #ff3d00;

            text-align: center;
            padding: 2rem;
            font-size: 0.75rem;
            color: #5f6c72;

            }

            }

            }

        { id: 21, name: "مشغل الأسطورة 2", desc: "مشغل مهكر ثانٍ", cat: "مشغل", size: "10 MB", rating: "4.8", icon: "https://traidmod.app/wp-content/uploads/2024/02/Ostora-Player-Logo-240x240.webp", downloadUrl: "https://www.mediafire.com/file/tpykvc0hiyxqdb5/Url_Player_2.apk/file" },
        { id: 23, name: "AYMAN TV مهكر", desc: "اشتراك مدفوع مجاناً", cat: "مشغل", size: "10 MB", rating: "4.8", icon: "https://traidmod.app/wp-content/uploads/2023/10/AYMANE-TV-Logo-240x240.webp", downloadUrl: "https://www.mediafire.com/file/3dgv6xc2d25q7yc/AYMANE_TV_v1.5_AdFree_NoPlayer.apk/file" }
    ];

    const appsListEl = document.getElementById('appsList');
    const searchInputEl = document.getElementById('searchInput');
    const searchBoxDiv = document.getElementById('searchBox');
    const searchIconBtn = document.getElementById('searchIcon');
    const resultsSpan = document.getElementById('resultsCount');
    const backBtnEl = document.getElementById('backBtn');

    let currentFiltered = [...apps];

    function renderApps(data) {
        appsListEl.innerHTML = '';
        if (data.length === 0) {
            appsListEl.innerHTML = `<div style="text-align:center; grid-column:1/-1; padding:3rem;">😔 لا توجد تطبيقات تطابق البحث</div>`;
            resultsSpan.innerText = `🚫 لا توجد نتائج`;
            return;
        }
        data.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
                <div class="app-icon">
                    <img src="${app.icon}" alt="${app.name}" onerror="this.src='https://placehold.co/100x100/2c2f36/ff5722?text=${encodeURIComponent(app.name.charAt(0))}'">
                </div>
                <div class="app-info">
                    <h3>${escapeHtml(app.name)} <span class="app-tag">${escapeHtml(app.cat)}</span></h3>
                    <p>${escapeHtml(app.desc.substring(0, 70))}${app.desc.length > 70 ? '...' : ''}</p>
                    <div class="app-meta">
                        <span><i class="fas fa-database"></i> ${app.size}</span>
                        <span><i class="fas fa-star" style="color: #ffb347;"></i> ${app.rating}</span>
                    </div>
                </div>
                <button class="download-btn" data-app-id="${app.id}"><i class="fas fa-download"></i> تحميل</button>
            `;
            appsListEl.appendChild(card);
        });
        resultsSpan.innerText = `📱 تم العثور على (${data.length}) تطبيق`;
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    function handleDownload(appId, btnElement) {
        const app = apps.find(a => a.id === appId);
        if (!app) return;
        const originalHTML = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري ...';
        btnElement.classList.add('downloading');
        btnElement.disabled = true;
        
        // إنشاء رابط تحميل
        const link = document.createElement('a');
        link.href = app.downloadUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.download = ''; 
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        setTimeout(() => {
            btnElement.innerHTML = '<i class="fas fa-check-circle"></i> تم بدء التحميل';
            btnElement.classList.remove('downloading');
            btnElement.classList.add('completed');
            setTimeout(() => {
                if (btnElement) {
                    btnElement.innerHTML = originalHTML;
                    btnElement.classList.remove('completed');
                    btnElement.disabled = false;
                }
            }, 2800);
        }, 600);
    }

    appsListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.download-btn');
        if (btn && btn.dataset.appId) {
            e.preventDefault();
            const id = parseInt(btn.dataset.appId);
            handleDownload(id, btn);
        }
    });

    searchIconBtn.onclick = () => {
        searchBoxDiv.classList.toggle('active');
        if (searchBoxDiv.classList.contains('active')) searchInputEl.focus();
    };

    function filterApps() {
        const query = searchInputEl.value.trim().toLowerCase();
        if (query === "") {
            currentFiltered = [...apps];
            backBtnEl.style.display = 'none';
        } else {
            currentFiltered = apps.filter(a => a.name.toLowerCase().includes(query) || a.cat.toLowerCase().includes(query));
            backBtnEl.style.display = 'block';
        }
        renderApps(currentFiltered);
    }

    searchInputEl.addEventListener('input', filterApps);
    backBtnEl.onclick = () => {
        searchInputEl.value = '';
        filterApps();
        backBtnEl.style.display = 'none';
        searchBoxDiv.classList.remove('active');
    };

    renderApps(apps);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
            searchBoxDiv.classList.add('active');
            searchInputEl.focus();
            e.preventDefault();
        }
        if (e.key === 'Escape') {
            if (searchBoxDiv.classList.contains('active')) {
                searchBoxDiv.classList.remove('active');
                searchInputEl.value = '';
                filterApps();
            }
        }
    });
</script>
</body>
</html>
