    <style>
        :root {
            --primary-color: #ff3d00;
            --primary-hover: #ff6429;
            --bg-dark: #05070a;

            --text-main: #ffffff;
            --text-dim: #bcbcbc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1a1f2c, #030507);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Premium Styling */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem 0;
            border-bottom: 2px solid rgba(255, 61, 0, 0.2);
            margin-bottom: 2rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid var(--primary-color);
        }

        .logo h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ff8a65, var(--primary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.2);
        }

        .logo p {
            color: var(--text-dim);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Search Enhancement */
        .search-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-icon {
            width: 50px;
            height: 50px;
            background: #1e2a2f;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 61, 0, 0.2);
        }

        .search-icon:hover, .search-icon:focus {
            background: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--primary-color);
            outline: none;
        }

        .search-box {
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box.active {
            width: 300px;
            opacity: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background: #12181c;
            border: 2px solid #2c3e4f;
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        /* Status & Filters */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 15px;
        }

        .back-btn {
            background: var(--primary-color);
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: none; /* سيظهر عند البحث فقط */
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--primary-hover);
        }

        /* Grid & Cards */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-color);
            background: #1a242d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .card-top {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: #232d36;
            border-radius: 18px;
            padding: 5px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 14px;
        }

        .app-main-info {
            flex: 1;
        }

        .app-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
        }

        .app-cat {
            display: inline-block;
            background: rgba(255, 61, 0, 0.15);
            color: #ffab91;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .app-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            height: 45px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .app-stats {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: #8899a6;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary-color), #ff6d00);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Profile Section */
        .dev-section {
            margin-top: 100px;
            background: linear-gradient(180deg, rgba(255,61,0,0.05) 0%, rgba(0,0,0,0.5) 100%);
            border-radius: 40px;
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid rgba(255,61,0,0.1);
        }

        .dev-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            margin: -90px auto 20px;
            background: #000;
            padding: 5px;
            box-shadow: 0 10px 25px rgba(255,61,0,0.2);
        }

        .dev-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: #1a242d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icon:hover {
            background: var(--primary-color);
            transform: translateY(-5px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem;
            color: #556677;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .search-box.active { width: 200px; }
            .logo h1 { font-size: 1.6rem; }
        }
    </style>
</head>

    const appsListEl = document.getElementById('appsList');
    const searchInput = document.getElementById('searchInput');
    const searchBox = document.getElementById('searchBox');
    const searchIcon = document.getElementById('searchIcon');
    const searchToggleIcon = document.getElementById('searchToggleIcon');
    const resultsCount = document.getElementById('resultsCount');
    const backBtn = document.getElementById('backBtn');

    function renderApps(data) {
        appsListEl.innerHTML = '';
        if (data.length === 0) {
            appsListEl.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 80px 20px;">
                    <i class="fas fa-search-minus" style="font-size: 4rem; color: var(--primary-color); margin-bottom: 20px; opacity: 0.5;"></i>
                    <h3 style="font-size: 1.5rem; margin-bottom: 10px;">عذراً، لا توجد نتائج!</h3>
                    <p style="color: var(--text-dim); margin-bottom: 30px;">تأكد من كتابة اسم التطبيق بشكل صحيح.</p>
                </div>`;
            resultsCount.innerHTML = `❌ لا توجد نتائج`;
            backBtn.style.display = 'block';
            return;
        }

        data.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
                <div class="card-top">
                    <div class="app-icon">
                        <img src="${app.icon}" alt="${app.name}" onerror="this.src='https://placehold.co/100x100/232d36/ff3d00?text=${app.name[0]}'">
                    </div>
                    <div class="app-main-info">
                        <div class="app-name">${app.name}</div>
                        <span class="app-cat">${app.cat}</span>
                    </div>
                </div>
                <div class="app-desc">${app.desc}</div>
                <div class="card-footer">
                    <div class="app-stats">
                        <span><i class="fas fa-hdd"></i> ${app.size}</span>
                        <span><i class="fas fa-star" style="color:#ffb300"></i> ${app.rating}</span>
                    </div>
                    <button class="download-btn" onclick="startDownload('${app.downloadUrl}', this)">
                        <i class="fas fa-download"></i> تحميل
                    </button>
                </div>
            `;
            appsListEl.appendChild(card);
        });
        resultsCount.innerHTML = `<i class="fas fa-check-circle"></i> تم العثور على ${data.length} تطبيق`;
    }

    function startDownload(url, btn) {
        const original = btn.innerHTML;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري...`;
        btn.disabled = true;
        setTimeout(() => {
            window.open(url, '_blank');
            btn.innerHTML = `<i class="fas fa-check"></i> بدأ الآن`;
            btn.style.background = "#00c853";
            setTimeout(() => {
                btn.innerHTML = original;
                btn.style.background = "";
                btn.disabled = false;
            }, 3000);
        }, 800);
    }

    searchIcon.onclick = () => {
        searchBox.classList.toggle('active');
        if (searchBox.classList.contains('active')) {
            searchInput.focus();
            searchToggleIcon.classList.replace('fa-search', 'fa-times');
        } else {
            searchToggleIcon.classList.replace('fa-times', 'fa-search');
            if (searchInput.value !== '') resetSearch();
        }
    };

    searchInput.oninput = (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = apps.filter(a => a.name.toLowerCase().includes(term) || a.cat.toLowerCase().includes(term));
        backBtn.style.display = term.length > 0 ? 'block' : 'none';
        renderApps(filtered);
    };

    function resetSearch() {
        searchInput.value = '';
        backBtn.style.display = 'none';
        renderApps(apps);
        searchBox.classList.remove('active');
        searchToggleIcon.classList.replace('fa-times', 'fa-search');
    }

    backBtn.onclick = resetSearch;

    window.onload = () => {
        setTimeout(() => renderApps(apps), 500);
    };
</script>
